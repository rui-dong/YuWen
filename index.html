<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>学语文</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    text-align: center;
  }

  /* 标题 */
  .title {
    font-size: 40px;
    margin: 30px 0;
  }

  /* 网格布局 */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px;
  }

  /* 每个格子 */
  .card {
    height: 120px;
    background: #f2f2f2;
    border-radius: 10px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 20px;
    cursor: pointer;
  }

  .card:hover {
    background: #ddd;
  }
</style>
</head>

<body>

<div class="title">学语文</div>

<div class="grid">

  <div class="card" onclick="goPractice()">认生字</div>
  <div class="card" onclick="goLookup()">查生字</div>
  <div class="card"></div>

  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>

</div>

<script>
function goPractice() {
  window.location.href = "recog.html";
}

function goLookup() {
  window.location.href = "lookup.html";
}
</script>

</body>
</html>
